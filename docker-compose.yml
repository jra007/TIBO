services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tibo
      POSTGRES_PASSWORD: tibo_dev_password
      POSTGRES_DB: tibo
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tibo"]
      interval: 5s
      timeout: 5s
      retries: 5

  relation-detection:
    build: ./relation-detection
    ports:
      - "8001:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://tibo:tibo_dev_password@postgres:5432/tibo
      RELATION_DETECTION_URL: http://relation-detection:8000
      # Dev-only values. JWT_SECRET must be a real secret (vault-managed) before any non-local
      # deployment; TIBO_ADMIN_PASSWORD sets the bootstrap admin's password on first run only.
      JWT_SECRET: dev-insecure-secret-change-me
      TIBO_ADMIN_PASSWORD: changeme123
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      relation-detection:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
