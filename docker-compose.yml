services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tibo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tibo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tibo}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tibo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  relation-detection:
    build: ./relation-detection
    ports:
      - "${RELATION_DETECTION_PORT:-8001}:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tibo}:${POSTGRES_PASSWORD:-tibo_dev_password}@postgres:5432/${POSTGRES_DB:-tibo}
      RELATION_DETECTION_URL: http://relation-detection:8000
      # Dev-only fallbacks. JWT_SECRET must be a real generated secret before any non-local
      # deployment (the backend refuses to start with this default when NODE_ENV=production);
      # TIBO_ADMIN_PASSWORD sets the bootstrap admin's password on first run only.
      # Set both via .env — see .env.example.
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      TIBO_ADMIN_PASSWORD: ${TIBO_ADMIN_PASSWORD:-changeme123}
      # CORS allowlist — comma-separated. Set to your real domain(s) via .env before any non-local
      # deployment; defaults to the local dev frontend origins when unset.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Where uploaded files (appearance logo/favicon) are stored on disk — persists via the
      # ./backend bind mount above, no separate volume needed.
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      relation-detection:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
